name: Release assets

# bin/release.sh creates the GitHub release; this attaches prebuilt binaries to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir dist
          for target in linux/arm64 linux/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/ask-gemini_${TAG}_${os}_${arch}" ./cmd/ask-gemini
          done
          cd dist
          sha256sum ask-gemini_* > SHA256SUMS
          gh release upload "$TAG" ./* --clobber
